<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="920" height="600" fill="#ffffff"/>

  <!-- ===================== Vallox unit ===================== -->
  <rect x="20" y="50" width="200" height="250" rx="8" fill="#eef3f8" stroke="#2b5d8c" stroke-width="2"/>
  <text x="120" y="40" text-anchor="middle" font-weight="bold" font-size="15">Vallox MV350</text>
  <text x="120" y="75" text-anchor="middle" fill="#2b5d8c" font-weight="bold">terminal X102</text>
  <g font-family="Consolas, monospace">
    <rect x="160" y="100" width="40" height="20" fill="#3fa34d" stroke="#1f5a27"/><text x="150" y="115" text-anchor="end">MB_A</text>
    <rect x="160" y="130" width="40" height="20" fill="#3fa34d" stroke="#1f5a27"/><text x="150" y="145" text-anchor="end">MB_B</text>
    <rect x="160" y="160" width="40" height="20" fill="#3fa34d" stroke="#1f5a27"/><text x="150" y="175" text-anchor="end">+24V</text>
    <rect x="160" y="190" width="40" height="20" fill="#3fa34d" stroke="#1f5a27" opacity="0.45"/><text x="150" y="205" text-anchor="end" fill="#888">RS_A</text>
    <rect x="160" y="220" width="40" height="20" fill="#3fa34d" stroke="#1f5a27" opacity="0.45"/><text x="150" y="235" text-anchor="end" fill="#888">RS_B</text>
    <rect x="160" y="250" width="40" height="20" fill="#3fa34d" stroke="#1f5a27"/><text x="150" y="265" text-anchor="end">GND</text>
  </g>
  <text x="30" y="290" font-size="11" fill="#555">RS_A / RS_B: not used</text>

  <!-- ===================== Modbus cable ===================== -->
  <!-- twisted pair A/B -->
  <path d="M200 110 C 225 110, 225 140, 250 140 S 275 110, 300 110 S 325 140, 350 140 S 375 110, 400 110" fill="none" stroke="#d62828" stroke-width="3"/>
  <path d="M200 140 C 225 140, 225 110, 250 110 S 275 140, 300 140 S 325 110, 350 110 S 375 140, 400 140" fill="none" stroke="#1d6fd6" stroke-width="3"/>
  <!-- optional 24 V supply -->
  <line x1="200" y1="170" x2="400" y2="170" stroke="#e07a00" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- common ground -->
  <path d="M200 260 L 300 260 L 300 200 L 400 200" fill="none" stroke="#222" stroke-width="3"/>

  <text x="300" y="92" text-anchor="middle" font-weight="bold">Modbus RTU / RS485</text>
  <text x="310" y="285" text-anchor="middle" font-size="11" fill="#555">twisted pair, shielded</text>
  <text x="310" y="299" text-anchor="middle" font-size="11" fill="#555">19200 baud, 8E1, slave ID 1</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#e07a00">optional supply</text>

  <!-- ===================== ESP32-S3 board ===================== -->
  <rect x="400" y="50" width="220" height="400" rx="8" fill="#1e2a38" stroke="#0d141c" stroke-width="2"/>
  <text x="510" y="40" text-anchor="middle" font-weight="bold" font-size="15">Waveshare ESP32-S3-RS485-CAN</text>
  <g fill="#ffffff" font-family="Consolas, monospace">
    <!-- left side: screw terminals -->
    <rect x="400" y="100" width="18" height="50" fill="#3fa34d"/>
    <text x="426" y="115">RS485 A</text>
    <text x="426" y="145">RS485 B</text>
    <rect x="400" y="160" width="18" height="50" fill="#3fa34d"/>
    <text x="426" y="175">VIN 7-36V</text>
    <text x="426" y="205">GND</text>
    <!-- right side: pin header -->
    <text x="604" y="115" text-anchor="end">3V3</text>
    <text x="604" y="145" text-anchor="end">GND</text>
    <text x="604" y="175" text-anchor="end">IO11</text>
    <text x="604" y="205" text-anchor="end">IO12</text>
    <text x="604" y="235" text-anchor="end">IO10</text>
    <text x="604" y="265" text-anchor="end">IO9</text>
    <text x="604" y="295" text-anchor="end">IO8</text>
    <text x="604" y="325" text-anchor="end">IO7</text>
    <text x="604" y="385" text-anchor="end">IO4</text>
    <text x="604" y="415" text-anchor="end">GND</text>
  </g>
  <g fill="#c9a227">
    <circle cx="620" cy="110" r="5"/><circle cx="620" cy="140" r="5"/><circle cx="620" cy="170" r="5"/>
    <circle cx="620" cy="200" r="5"/><circle cx="620" cy="230" r="5"/><circle cx="620" cy="260" r="5"/>
    <circle cx="620" cy="290" r="5"/><circle cx="620" cy="320" r="5"/><circle cx="620" cy="380" r="5"/>
    <circle cx="620" cy="410" r="5"/>
  </g>
  <!-- internal UART note -->
  <text x="426" y="250" fill="#9fb3c8" font-size="11">on board: RS485 transceiver</text>
  <text x="426" y="265" fill="#9fb3c8" font-size="11">RX = IO18, TX = IO17</text>
  <!-- termination -->
  <rect x="426" y="290" width="120" height="34" rx="4" fill="none" stroke="#9fb3c8" stroke-dasharray="4 3"/>
  <text x="486" y="304" text-anchor="middle" fill="#9fb3c8" font-size="11">120 Ω termination</text>
  <text x="486" y="318" text-anchor="middle" fill="#9fb3c8" font-size="11">between A and B</text>
  <!-- USB -->
  <rect x="485" y="430" width="50" height="20" rx="4" fill="#9aa5b1"/>
  <text x="510" y="472" text-anchor="middle" font-size="11" fill="#555">USB-C: flashing, serial log, power</text>

  <!-- ===================== ePaper wires ===================== -->
  <g stroke-width="3">
    <line x1="625" y1="110" x2="740" y2="110" stroke="#d62828"/>
    <line x1="625" y1="140" x2="740" y2="140" stroke="#222"/>
    <line x1="625" y1="170" x2="740" y2="170" stroke="#1d6fd6"/>
    <line x1="625" y1="200" x2="740" y2="200" stroke="#e6c200"/>
    <line x1="625" y1="230" x2="740" y2="230" stroke="#f08c00"/>
    <line x1="625" y1="260" x2="740" y2="260" stroke="#2f9e44"/>
    <line x1="625" y1="290" x2="740" y2="290" stroke="#adb5bd"/>
    <line x1="625" y1="320" x2="740" y2="320" stroke="#7b2cbf"/>
  </g>

  <!-- ===================== ePaper module ===================== -->
  <rect x="740" y="80" width="160" height="260" rx="6" fill="#f4f4f0" stroke="#333" stroke-width="2"/>
  <text x="820" y="40" text-anchor="middle" font-weight="bold" font-size="15">ePaper 2.9" b/w</text>
  <text x="820" y="58" text-anchor="middle" font-size="11" fill="#555">Waveshare, 128 x 296, SPI</text>
  <g font-family="Consolas, monospace">
    <text x="752" y="115">VCC</text><text x="752" y="145">GND</text>
    <text x="752" y="175">DIN</text><text x="752" y="205">CLK</text>
    <text x="752" y="235">CS</text><text x="752" y="265">DC</text>
    <text x="752" y="295">RST</text><text x="752" y="325">BUSY</text>
  </g>
  <rect x="815" y="120" width="70" height="190" fill="#ffffff" stroke="#999"/>
  <text x="850" y="150" text-anchor="middle" font-weight="bold" font-size="16">14:37</text>
  <text x="850" y="190" text-anchor="middle" font-size="11">-3.5 °C</text>
  <text x="850" y="225" text-anchor="middle" font-size="11">21.3 °C</text>
  <rect x="815" y="285" width="70" height="25" fill="#111"/>
  <text x="850" y="302" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">HOME</text>

  <!-- ===================== Button ===================== -->
  <line x1="625" y1="380" x2="740" y2="380" stroke="#222" stroke-width="2"/>
  <line x1="625" y1="410" x2="740" y2="410" stroke="#222" stroke-width="2"/>
  <line x1="740" y1="380" x2="740" y2="388" stroke="#222" stroke-width="2"/>
  <line x1="740" y1="402" x2="740" y2="410" stroke="#222" stroke-width="2"/>
  <line x1="730" y1="386" x2="752" y2="398" stroke="#222" stroke-width="2"/>
  <line x1="752" y1="378" x2="752" y2="390" stroke="#222" stroke-width="2"/>
  <line x1="746" y1="378" x2="758" y2="378" stroke="#222" stroke-width="2"/>
  <text x="770" y="390" font-weight="bold">Mode button</text>
  <text x="770" y="406" font-size="11" fill="#555">push button to GND,</text>
  <text x="770" y="420" font-size="11" fill="#555">internal pull-up</text>

  <!-- ===================== Legend ===================== -->
  <line x1="20" y1="500" x2="900" y2="500" stroke="#ccc"/>
  <g font-size="12">
    <line x1="20" y1="525" x2="50" y2="525" stroke="#d62828" stroke-width="3"/><text x="58" y="529">A (MB_A)</text>
    <line x1="140" y1="525" x2="170" y2="525" stroke="#1d6fd6" stroke-width="3"/><text x="178" y="529">B (MB_B)</text>
    <line x1="260" y1="525" x2="290" y2="525" stroke="#222" stroke-width="3"/><text x="298" y="529">GND / reference</text>
    <line x1="420" y1="525" x2="450" y2="525" stroke="#e07a00" stroke-width="3" stroke-dasharray="8 6"/><text x="458" y="529">optional: +24 V from the unit to VIN</text>
    <text x="20" y="560" fill="#555">ePaper wire colours follow the standard Waveshare 8-pin cable. If the unit does not answer, swap A and B.</text>
    <text x="20" y="580" fill="#555">Concept drawing, not to scale. Check board pinout / VIN range against the Waveshare documentation of your board revision.</text>
  </g>
</svg>
